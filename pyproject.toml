[project]
name = "gtm-analytics"
version = "0.1.0"
description = "A GTM analytics data platform demonstrating reliable ingestion and analytics engineering."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.43.118",
    "minio>=7.2.20",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dbt-postgres>=1.10,<2",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
