version: 2

models:
  - name: dim_date
    description: Calendar dimension covering source and opportunity snapshot dates.
    columns:
      - name: date_key
        data_tests:
          - not_null
          - unique
      - name: date_day
        data_tests:
          - not_null
          - unique

  - name: dim_account
    description: SCD2 account dimension using dbt snapshot validity intervals.
    columns:
      - name: account_key
        data_tests:
          - not_null
          - unique
      - name: account_id
        data_tests:
          - not_null
      - name: effective_from
        data_tests:
          - not_null

  - name: dim_opportunity
    description: Current opportunity attributes; stage history is held in the fact.
    columns:
      - name: opportunity_key
        data_tests:
          - not_null
          - unique
      - name: account_id
        data_tests:
          - not_null
      - name: current_stage
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - qualification
                  - discovery
                  - evaluation
                  - proposal
                  - negotiation
                  - closed_won
                  - closed_lost

  - name: fact_activity
    description: One row per current activity event.
    columns:
      - name: activity_id
        data_tests:
          - not_null
          - unique
      - name: account_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_key
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: fact_opportunity_snapshot
    description: One row per opportunity and weekly snapshot date.
    columns:
      - name: opportunity_snapshot_key
        data_tests:
          - not_null
          - unique
      - name: account_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_key
      - name: opportunity_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_opportunity')
                field: opportunity_key
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
